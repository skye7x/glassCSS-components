<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glass Toggle Switch</title>
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #2b2f36;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  .switch {
    width: 64px;
    height: 36px;
    position: relative;
    display: inline-block;
  }

  .switch input {
    opacity: 0;
    width: 0;
    height: 0;
  }

  .track {
    position: absolute;
    inset: 0;
    cursor: pointer;
    border-radius: 999px;
    background: rgba(0, 0, 0, 0.35);
    backdrop-filter: blur(10px);
    transition: background 0.25s ease;
    overflow: hidden;
  }

  .track::before {
    content: "";
    position: absolute;
    inset: 0;
    padding: 1px;
    border-radius: 999px;
    background: linear-gradient(
      -15deg,
      rgba(255, 255, 255, 0.08) 11%,
      rgba(255, 255, 255, 0.22) 60%,
      rgba(255, 255, 255, 0.9) 100%
    );
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events: none;
  }

  .knob {
    position: absolute;
    top: 3px;
    left: 3px;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: linear-gradient(to bottom right, #FFFFFF, #FFFFFF80);
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
    transition: transform 0.25s ease;
  }

  input:checked + .track {
    background: rgba(70, 200, 130, 0.45);
  }

  input:checked + .track .knob {
    transform: translateX(28px);
  }
</style>
</head>
<body>
  <label class="switch">
    <input type="checkbox" checked>
    <span class="track">
      <span class="knob"></span>
    </span>
  </label>
</body>
</html>
