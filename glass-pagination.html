<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glass Pagination</title>
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #20232c;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  .pagination {
    position: relative;
    display: flex;
    gap: 4px;
    padding: 6px;
    border-radius: 999px;
    background: rgba(0, 0, 0, 0.3);
    backdrop-filter: blur(14px);
    overflow: hidden;
  }

  .pagination::before {
    content: "";
    position: absolute;
    inset: 0;
    padding: 1px;
    border-radius: 999px;
    background: linear-gradient(-15deg, rgba(255,255,255,0.08) 11%, rgba(255,255,255,0.22) 60%, rgba(255,255,255,0.9) 100%);
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events: none;
  }

  .pagination button {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: none;
    background: transparent;
    color: rgba(255, 255, 255, 0.6);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    position: relative;
    z-index: 1;
  }

  .pagination button.active {
    color: #1a1a1a;
    background: linear-gradient(to bottom right, #FFFFFF, #FFFFFF80);
  }

  .pagination button:disabled {
    opacity: 0.3;
    cursor: default;
  }
</style>
</head>
<body>
  <div class="pagination">
    <button>&lsaquo;</button>
    <button class="active">1</button>
    <button>2</button>
    <button>3</button>
    <button>4</button>
    <button>&rsaquo;</button>
  </div>
</body>
</html>
