<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glass Alert</title>
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #1a1e27;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  .alert {
    position: relative;
    width: 340px;
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 16px 18px;
    border-radius: 16px;
    background: rgba(74, 222, 128, 0.12);
    backdrop-filter: blur(16px);
    overflow: hidden;
  }

  .alert::before {
    content: "";
    position: absolute;
    inset: 0;
    padding: 1px;
    border-radius: 16px;
    background: linear-gradient(-15deg, rgba(74,222,128,0.2) 11%, rgba(74,222,128,0.4) 60%, rgba(255,255,255,0.9) 100%);
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events: none;
  }

  .icon {
    width: 26px;
    height: 26px;
    flex-shrink: 0;
    border-radius: 50%;
    background: #4ade80;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .icon svg { width: 14px; height: 14px; }

  .text h4 {
    margin: 0 0 3px;
    font-size: 14px;
    color: #fff;
  }

  .text p {
    margin: 0;
    font-size: 13px;
    color: rgba(255, 255, 255, 0.65);
    line-height: 1.4;
  }
</style>
</head>
<body>
  <div class="alert">
    <div class="icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="#0a1f14" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
    </div>
    <div class="text">
      <h4>Changes saved</h4>
      <p>Your project settings were updated successfully.</p>
    </div>
  </div>
</body>
</html>
