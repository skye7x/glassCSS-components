<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glass Table</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #191b23; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  .table {
    position: relative; width: 380px; border-radius: 18px;
    background: rgba(255,255,255,0.05); backdrop-filter: blur(16px); overflow: hidden;
  }
  .table::before {
    content: ""; position: absolute; inset: 0; padding: 1px; border-radius: 18px;
    background: linear-gradient(-15deg, rgba(255,255,255,0.08) 11%, rgba(255,255,255,0.2) 60%, rgba(255,255,255,0.85) 100%);
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude; pointer-events: none;
  }
  .row {
    display: flex; align-items: center; gap: 12px; padding: 12px 16px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  .row:last-child { border-bottom: none; }
  .avatar { width: 32px; height: 32px; border-radius: 50%; background: linear-gradient(135deg, #60a5fa, #a78bfa); flex-shrink: 0; }
  .name { flex: 1; color: #fff; font-size: 13px; font-weight: 600; }
  .role { flex: 1; color: rgba(255,255,255,0.45); font-size: 12px; }
  .status {
    font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 999px;
    background: rgba(74,222,128,0.15); color: #4ade80;
  }
</style>
</head>
<body>
  <div class="table">
    <div class="row"><div class="avatar"></div><div class="name">Maya Chen</div><div class="role">Designer</div><div class="status">Active</div></div>
    <div class="row"><div class="avatar"></div><div class="name">Leo Park</div><div class="role">Engineer</div><div class="status">Active</div></div>
    <div class="row"><div class="avatar"></div><div class="name">Ana Rossi</div><div class="role">PM</div><div class="status">Active</div></div>
  </div>
</body>
</html>
