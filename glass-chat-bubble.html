<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glass Chat Bubble</title>
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    background: #191c26;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  .row { width: 320px; display: flex; }
  .row.right { justify-content: flex-end; }

  .bubble {
    position: relative;
    max-width: 220px;
    padding: 12px 16px;
    border-radius: 18px;
    font-size: 14px;
    line-height: 1.4;
    color: #fff;
    overflow: hidden;
  }

  .bubble.in {
    background: rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(14px);
    border-bottom-left-radius: 6px;
  }

  .bubble.out {
    background: linear-gradient(135deg, rgba(96,165,250,0.5), rgba(167,139,250,0.5));
    backdrop-filter: blur(14px);
    border-bottom-right-radius: 6px;
  }

  .bubble::before {
    content: "";
    position: absolute;
    inset: 0;
    padding: 1px;
    border-radius: inherit;
    background: linear-gradient(-15deg, rgba(255,255,255,0.08) 11%, rgba(255,255,255,0.22) 60%, rgba(255,255,255,0.9) 100%);
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events: none;
  }
</style>
</head>
<body>
  <div class="row"><div class="bubble in">Hey, are we still on for tomorrow?</div></div>
  <div class="row right"><div class="bubble out">Yep! 10am works great 🙌</div></div>
</body>
</html>
