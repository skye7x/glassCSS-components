<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glass Slider</title>
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #1a1d29;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  .wrap {
    position: relative;
    width: 260px;
    padding: 18px 20px;
    border-radius: 20px;
    background: rgba(255, 255, 255, 0.06);
    backdrop-filter: blur(16px);
    overflow: hidden;
  }

  .wrap::before {
    content: "";
    position: absolute;
    inset: 0;
    padding: 1px;
    border-radius: 20px;
    background: linear-gradient(
      -15deg,
      rgba(255, 255, 255, 0.08) 11%,
      rgba(255, 255, 255, 0.22) 60%,
      rgba(255, 255, 255, 0.9) 100%
    );
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events: none;
  }

  .label {
    display: flex;
    justify-content: space-between;
    color: #fff;
    font-size: 13px;
    margin-bottom: 10px;
  }

  input[type="range"] {
    -webkit-appearance: none;
    width: 100%;
    height: 6px;
    border-radius: 999px;
    background: rgba(0, 0, 0, 0.35);
    outline: none;
  }

  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: linear-gradient(to bottom right, #FFFFFF, #FFFFFF80);
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
    cursor: pointer;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="label"><span>Volume</span><span>72%</span></div>
    <input type="range" min="0" max="100" value="72">
  </div>
</body>
</html>
