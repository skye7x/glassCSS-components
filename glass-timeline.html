<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glass Timeline</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #1a1c25; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  .timeline {
    position: relative; width: 300px; padding: 22px 20px; border-radius: 20px;
    background: rgba(255,255,255,0.06); backdrop-filter: blur(16px); overflow: hidden;
  }
  .timeline::before {
    content: ""; position: absolute; inset: 0; padding: 1px; border-radius: 20px;
    background: linear-gradient(-15deg, rgba(255,255,255,0.08) 11%, rgba(255,255,255,0.2) 60%, rgba(255,255,255,0.85) 100%);
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude; pointer-events: none;
  }
  .step { display: flex; gap: 14px; position: relative; }
  .step:not(:last-child) { padding-bottom: 24px; }
  .step:not(:last-child)::before {
    content: ""; position: absolute; left: 10px; top: 22px; bottom: 0; width: 2px;
    background: rgba(255,255,255,0.15);
  }
  .dot { width: 22px; height: 22px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; z-index: 1; }
  .step.done .dot { background: #4ade80; }
  .step.active .dot { background: #fff; }
  .step.pending .dot { background: rgba(255,255,255,0.12); border: 2px solid rgba(255,255,255,0.25); }
  .dot svg { width: 12px; height: 12px; }
  .text h4 { margin: 0 0 2px; font-size: 13px; color: #fff; }
  .text p { margin: 0; font-size: 12px; color: rgba(255,255,255,0.45); }
</style>
</head>
<body>
  <div class="timeline">
    <div class="step done">
      <div class="dot"><svg viewBox="0 0 24 24" fill="none" stroke="#0a1f14" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg></div>
      <div class="text"><h4>Order placed</h4><p>Aug 12, 9:41 AM</p></div>
    </div>
    <div class="step active">
      <div class="dot"></div>
      <div class="text"><h4>Out for delivery</h4><p>Arriving today</p></div>
    </div>
    <div class="step pending">
      <div class="dot"></div>
      <div class="text"><h4>Delivered</h4><p>Pending</p></div>
    </div>
  </div>
</body>
</html>
