<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glass Avatar Stack</title>
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #1f2330;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  .stack {
    display: flex;
    align-items: center;
  }

  .stack .av {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    margin-left: -12px;
    border: 2.5px solid rgba(20, 20, 28, 0.9);
    background: linear-gradient(135deg, var(--c1), var(--c2));
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.35);
  }

  .stack .av:first-child { margin-left: 0; }

  .av.a { --c1:#60a5fa; --c2:#a78bfa; }
  .av.b { --c1:#f472b6; --c2:#fb923c; }
  .av.c { --c1:#34d399; --c2:#60a5fa; }

  .more {
    position: relative;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    margin-left: -12px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 12px;
    font-weight: 700;
    background: rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(10px);
    border: 2.5px solid rgba(20, 20, 28, 0.9);
    overflow: hidden;
  }

  .more::before {
    content: "";
    position: absolute;
    inset: 0;
    padding: 1px;
    border-radius: 50%;
    background: linear-gradient(-15deg, rgba(255,255,255,0.1) 11%, rgba(255,255,255,0.25) 60%, rgba(255,255,255,1) 100%);
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
  }
</style>
</head>
<body>
  <div class="stack">
    <div class="av a"></div>
    <div class="av b"></div>
    <div class="av c"></div>
    <div class="more">+9</div>
  </div>
</body>
</html>
