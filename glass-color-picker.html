<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glass Color Picker</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #1d1f28; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  .picker {
    position: relative; display: flex; gap: 12px; padding: 16px 20px; border-radius: 20px;
    background: rgba(255,255,255,0.06); backdrop-filter: blur(16px); overflow: hidden;
  }
  .picker::before {
    content: ""; position: absolute; inset: 0; padding: 1px; border-radius: 20px;
    background: linear-gradient(-15deg, rgba(255,255,255,0.08) 11%, rgba(255,255,255,0.22) 60%, rgba(255,255,255,0.9) 100%);
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude; pointer-events: none;
  }
  .swatch { width: 34px; height: 34px; border-radius: 50%; cursor: pointer; position: relative; border: 2px solid transparent; }
  .swatch.selected { border-color: #fff; box-shadow: 0 0 0 3px rgba(255,255,255,0.15); }
  .s1 { background: #f472b6; } .s2 { background: #fb923c; } .s3 { background: #fbbf24; }
  .s4 { background: #4ade80; } .s5 { background: #60a5fa; } .s6 { background: #a78bfa; }
</style>
</head>
<body>
  <div class="picker">
    <div class="swatch s1"></div>
    <div class="swatch s2"></div>
    <div class="swatch s3 selected"></div>
    <div class="swatch s4"></div>
    <div class="swatch s5"></div>
    <div class="swatch s6"></div>
  </div>
</body>
</html>
