<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glass Badge</title>
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    background: #1c1c22;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  .badge {
    position: relative;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 14px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
    color: #fff;
    background: rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(12px);
    overflow: hidden;
  }

  .badge::before {
    content: "";
    position: absolute;
    inset: 0;
    padding: 1px;
    border-radius: 999px;
    background: linear-gradient(
      -15deg,
      rgba(255, 255, 255, 0.1) 11%,
      rgba(255, 255, 255, 0.25) 60%,
      rgba(255, 255, 255, 0.9) 100%
    );
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events: none;
  }

  .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
  }

  .badge.green .dot { background: #4ade80; }
  .badge.blue .dot { background: #60a5fa; }
  .badge.amber .dot { background: #fbbf24; }
</style>
</head>
<body>
  <span class="badge green"><span class="dot"></span>Online</span>
  <span class="badge blue"><span class="dot"></span>In Review</span>
  <span class="badge amber"><span class="dot"></span>Pending</span>
</body>
</html>
