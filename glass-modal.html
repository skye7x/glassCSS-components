<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glass Modal</title>
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: url('https://images.unsplash.com/photo-1497436072909-60f360e1d4b1?w=1200&q=60') center/cover;
  }

  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.45);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .modal {
    position: relative;
    width: 320px;
    padding: 28px;
    border-radius: 22px;
    background: rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(24px);
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
    overflow: hidden;
  }

  .modal::before {
    content: "";
    position: absolute;
    inset: 0;
    padding: 1px;
    border-radius: 22px;
    background: linear-gradient(-15deg, rgba(255,255,255,0.1) 11%, rgba(255,255,255,0.25) 60%, rgba(255,255,255,1) 100%);
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events: none;
  }

  h2 { margin: 0 0 8px; font-size: 19px; }
  p { margin: 0 0 22px; font-size: 14px; color: rgba(255, 255, 255, 0.7); line-height: 1.5; }

  .actions { display: flex; gap: 10px; }

  .btn {
    flex: 1;
    padding: 10px;
    border-radius: 12px;
    border: none;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }

  .btn.primary {
    background: linear-gradient(to bottom right, #FFFFFF, #FFFFFF80);
    color: #1a1a1a;
  }

  .btn.ghost {
    background: rgba(255, 255, 255, 0.1);
    color: #fff;
    border: 1px solid rgba(255, 255, 255, 0.3);
  }
</style>
</head>
<body>
  <div class="overlay">
    <div class="modal">
      <h2>Delete file?</h2>
      <p>This action can't be undone. The file will be permanently removed.</p>
      <div class="actions">
        <button class="btn ghost">Cancel</button>
        <button class="btn primary">Delete</button>
      </div>
    </div>
  </div>
</body>
</html>
