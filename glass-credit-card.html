<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glass Credit Card</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 20% 80%, #2d1f4e, #100e1a 70%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  .card {
    position: relative; width: 320px; height: 190px; padding: 24px;
    border-radius: 22px; background: linear-gradient(135deg, rgba(167,139,250,0.35), rgba(96,165,250,0.25));
    backdrop-filter: blur(20px); color: #fff; overflow: hidden;
    display: flex; flex-direction: column; justify-content: space-between;
    box-shadow: 0 16px 40px rgba(0,0,0,0.4);
  }
  .card::before {
    content: ""; position: absolute; inset: 0; padding: 1px; border-radius: 22px;
    background: linear-gradient(-15deg, rgba(255,255,255,0.15) 11%, rgba(255,255,255,0.35) 60%, rgba(255,255,255,1) 100%);
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude; pointer-events: none;
  }
  .top { display: flex; justify-content: space-between; align-items: flex-start; }
  .chip { width: 38px; height: 28px; border-radius: 6px; background: linear-gradient(135deg, #fde68a, #f59e0b); }
  .brand { font-size: 14px; font-weight: 700; letter-spacing: 0.04em; opacity: 0.9; }
  .number { font-size: 18px; letter-spacing: 0.15em; font-weight: 500; }
  .bottom { display: flex; justify-content: space-between; align-items: flex-end; font-size: 11px; }
  .bottom .name { font-size: 13px; font-weight: 600; letter-spacing: 0.03em; }
  .bottom span { display: block; opacity: 0.5; margin-bottom: 2px; text-transform: uppercase; font-size: 9px; letter-spacing: 0.06em; }
</style>
</head>
<body>
  <div class="card">
    <div class="top"><div class="chip"></div><div class="brand">VISA</div></div>
    <div class="number">4291  ••••  ••••  8823</div>
    <div class="bottom">
      <div><span>Card holder</span><div class="name">Maya Chen</div></div>
      <div><span>Expires</span><div class="name">09/29</div></div>
    </div>
  </div>
</body>
</html>
