<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glass Stat Card</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    gap: 16px; background: #191b24; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  .stat {
    position: relative; width: 180px; padding: 20px; border-radius: 20px;
    background: rgba(255,255,255,0.06); backdrop-filter: blur(16px); overflow: hidden;
  }
  .stat::before {
    content: ""; position: absolute; inset: 0; padding: 1px; border-radius: 20px;
    background: linear-gradient(-15deg, rgba(255,255,255,0.08) 11%, rgba(255,255,255,0.22) 60%, rgba(255,255,255,0.9) 100%);
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude; pointer-events: none;
  }
  .stat .label { font-size: 12px; color: rgba(255,255,255,0.5); margin-bottom: 8px; }
  .stat .value { font-size: 26px; font-weight: 700; color: #fff; margin-bottom: 6px; }
  .stat .delta { font-size: 12px; font-weight: 600; display: inline-flex; align-items: center; gap: 4px; }
  .stat .delta.up { color: #4ade80; }
  .stat .delta.down { color: #f87171; }
</style>
</head>
<body>
  <div class="stat">
    <div class="label">Revenue</div>
    <div class="value">$48.2k</div>
    <div class="delta up">▲ 12.4%</div>
  </div>
  <div class="stat">
    <div class="label">Churn</div>
    <div class="value">2.1%</div>
    <div class="delta down">▼ 0.4%</div>
  </div>
</body>
</html>
