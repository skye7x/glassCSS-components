<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glass Dropdown</title>
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #24283a;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  .dropdown {
    position: relative;
    width: 220px;
  }

  .trigger {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    border-radius: 14px;
    background: rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(16px);
    color: #fff;
    font-size: 14px;
    cursor: pointer;
    position: relative;
    overflow: hidden;
  }

  .trigger::before, .menu::before {
    content: "";
    position: absolute;
    inset: 0;
    padding: 1px;
    border-radius: inherit;
    background: linear-gradient(-15deg, rgba(255,255,255,0.08) 11%, rgba(255,255,255,0.22) 60%, rgba(255,255,255,0.9) 100%);
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events: none;
  }

  .trigger svg { width: 16px; height: 16px; opacity: 0.7; }

  .menu {
    position: absolute;
    top: calc(100% + 8px);
    left: 0;
    width: 100%;
    border-radius: 14px;
    background: rgba(30, 30, 40, 0.55);
    backdrop-filter: blur(20px);
    overflow: hidden;
    box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
  }

  .menu a {
    display: block;
    padding: 11px 16px;
    color: rgba(255, 255, 255, 0.85);
    font-size: 14px;
    text-decoration: none;
    transition: background 0.15s ease;
  }

  .menu a:hover { background: rgba(255, 255, 255, 0.1); }
</style>
</head>
<body>
  <div class="dropdown">
    <div class="trigger">
      Sort by: Newest
      <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
    </div>
    <div class="menu">
      <a href="#">Newest</a>
      <a href="#">Oldest</a>
      <a href="#">Most popular</a>
      <a href="#">A–Z</a>
    </div>
  </div>
</body>
</html>
