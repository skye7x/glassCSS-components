<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glass Context Menu</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #1e2029; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  .menu {
    position: relative; width: 190px; padding: 6px; border-radius: 14px;
    background: rgba(30,30,40,0.55); backdrop-filter: blur(22px);
    box-shadow: 0 14px 34px rgba(0,0,0,0.4); overflow: hidden;
  }
  .menu::before {
    content: ""; position: absolute; inset: 0; padding: 1px; border-radius: 14px;
    background: linear-gradient(-15deg, rgba(255,255,255,0.08) 11%, rgba(255,255,255,0.22) 60%, rgba(255,255,255,0.9) 100%);
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude; pointer-events: none;
  }
  .item {
    display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 9px;
    color: rgba(255,255,255,0.85); font-size: 13px; cursor: pointer;
  }
  .item svg { width: 15px; height: 15px; opacity: 0.7; }
  .item:hover { background: rgba(255,255,255,0.1); }
  .item.danger { color: #f87171; }
  .divider { height: 1px; background: rgba(255,255,255,0.1); margin: 5px 4px; }
</style>
</head>
<body>
  <div class="menu">
    <div class="item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16v16H4z"></path></svg>Copy</div>
    <div class="item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"></path></svg>Rename</div>
    <div class="item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"></path><polyline points="16 6 12 2 8 6"></polyline><line x1="12" y1="2" x2="12" y2="15"></line></svg>Share</div>
    <div class="divider"></div>
    <div class="item danger"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path></svg>Delete</div>
  </div>
</body>
</html>
