<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gradient Close Button</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #4A4848;
    }

    .close-btn {
      width: 44px;
      height: 44px;
      padding: 0;
      border: none;
      border-radius: 50%;
      cursor: pointer;

      background-color: rgba(0, 0, 0, 0.30);

      display: flex;
      align-items: center;
      justify-content: center;

      position: relative;
      overflow: hidden;
    }

    .close-btn::before {
      content: "";
      position: absolute;
      inset: 0;
      padding: 1px;
      border-radius: 50%;

      background: linear-gradient(
        -15deg,
        rgba(255, 255, 255, 0.1) 11%,
        rgba(255, 255, 255, 0.25) 60%,
        rgba(255, 255, 255, 1) 100%
      );

      -webkit-mask:
        linear-gradient(#fff 0 0) content-box,
        linear-gradient(#fff 0 0);

      -webkit-mask-composite: xor;
      mask-composite: exclude;

      pointer-events: none;
    }

    .close-btn span {
      position: relative;
      z-index: 1;

      color: white;
      font-size: 24px;
      font-weight: 300;
      line-height: 1;
    }

    .close-btn:hover {
      background-color: rgba(0, 0, 0, 0.45);
    }
  </style>
</head>

<body>

  <button class="close-btn" aria-label="Close">
    <span>×</span>
  </button>

</body>
</html>
