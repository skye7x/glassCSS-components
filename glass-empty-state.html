<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glass Empty State</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #1b1e28; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  .empty {
    position: relative; width: 300px; padding: 36px 24px; border-radius: 22px;
    background: rgba(255,255,255,0.05); backdrop-filter: blur(16px);
    text-align: center; overflow: hidden;
  }
  .empty::before {
    content: ""; position: absolute; inset: 0; padding: 1px; border-radius: 22px;
    background: linear-gradient(-15deg, rgba(255,255,255,0.08) 11%, rgba(255,255,255,0.2) 60%, rgba(255,255,255,0.85) 100%);
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude; pointer-events: none;
  }
  .icon-circle {
    width: 56px; height: 56px; border-radius: 50%; margin: 0 auto 16px;
    background: rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: center;
  }
  .icon-circle svg { width: 26px; height: 26px; stroke: rgba(255,255,255,0.5); }
  h4 { margin: 0 0 6px; color: #fff; font-size: 15px; }
  p { margin: 0 0 20px; color: rgba(255,255,255,0.45); font-size: 13px; line-height: 1.5; }
  button {
    border: none; padding: 10px 20px; border-radius: 999px; font-size: 13px; font-weight: 600;
    background: linear-gradient(to bottom right, #FFFFFF, #FFFFFF80); color: #1a1a1a; cursor: pointer;
  }
</style>
</head>
<body>
  <div class="empty">
    <div class="icon-circle">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8v13H3V8"></path><path d="M1 3h22v5H1z"></path><line x1="10" y1="12" x2="14" y2="12"></line></svg>
    </div>
    <h4>No projects yet</h4>
    <p>Create your first project to get started with your team.</p>
    <button>New project</button>
  </div>
</body>
</html>
