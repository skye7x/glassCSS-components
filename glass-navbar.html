<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glass Navbar</title>
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: linear-gradient(160deg, #3b2f5e, #16121f 70%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  nav {
    position: relative;
    max-width: 560px;
    margin: 40px auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 20px;
    border-radius: 18px;
    background: rgba(255, 255, 255, 0.07);
    backdrop-filter: blur(20px);
    overflow: hidden;
  }

  nav::before {
    content: "";
    position: absolute;
    inset: 0;
    padding: 1px;
    border-radius: 18px;
    background: linear-gradient(-15deg, rgba(255,255,255,0.08) 11%, rgba(255,255,255,0.22) 60%, rgba(255,255,255,0.9) 100%);
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events: none;
  }

  .brand {
    color: #fff;
    font-weight: 700;
    font-size: 16px;
    letter-spacing: -0.02em;
  }

  .links {
    display: flex;
    gap: 22px;
  }

  .links a {
    color: rgba(255, 255, 255, 0.7);
    text-decoration: none;
    font-size: 14px;
    font-weight: 500;
  }

  .links a.active { color: #fff; }

  .cta {
    padding: 8px 18px;
    border-radius: 999px;
    background: linear-gradient(to bottom right, #FFFFFF, #FFFFFF80);
    color: #1a1a1a;
    font-size: 13px;
    font-weight: 700;
    border: none;
    cursor: pointer;
  }
</style>
</head>
<body>
  <nav>
    <span class="brand">Nova</span>
    <div class="links">
      <a href="#" class="active">Home</a>
      <a href="#">Docs</a>
      <a href="#">Pricing</a>
    </div>
    <button class="cta">Sign up</button>
  </nav>
</body>
</html>
