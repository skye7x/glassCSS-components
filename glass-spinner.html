<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glass Spinner</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #17191f; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  .loader {
    position: relative; width: 120px; height: 120px; border-radius: 28px;
    background: rgba(255,255,255,0.06); backdrop-filter: blur(18px);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    overflow: hidden;
  }
  .loader::before {
    content: ""; position: absolute; inset: 0; padding: 1px; border-radius: 28px;
    background: linear-gradient(-15deg, rgba(255,255,255,0.08) 11%, rgba(255,255,255,0.22) 60%, rgba(255,255,255,0.9) 100%);
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude; pointer-events: none;
  }
  .spin {
    width: 32px; height: 32px; border-radius: 50%;
    border: 3px solid rgba(255,255,255,0.15); border-top-color: #fff;
    animation: spin 0.8s linear infinite;
  }
  .loader span { font-size: 12px; color: rgba(255,255,255,0.55); }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div class="loader">
    <div class="spin"></div>
    <span>Loading…</span>
  </div>
</body>
</html>
