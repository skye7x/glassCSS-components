<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glass Tab Bar</title>
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #23272f;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  .tabs {
    position: relative;
    display: flex;
    gap: 4px;
    padding: 5px;
    border-radius: 999px;
    background: rgba(0, 0, 0, 0.3);
    backdrop-filter: blur(14px);
    overflow: hidden;
  }

  .tabs::before {
    content: "";
    position: absolute;
    inset: 0;
    padding: 1px;
    border-radius: 999px;
    background: linear-gradient(
      -15deg,
      rgba(255, 255, 255, 0.08) 11%,
      rgba(255, 255, 255, 0.22) 60%,
      rgba(255, 255, 255, 0.9) 100%
    );
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events: none;
  }

  .tabs input { display: none; }

  .tabs label {
    position: relative;
    z-index: 1;
    padding: 8px 18px;
    font-size: 14px;
    font-weight: 600;
    color: rgba(255, 255, 255, 0.55);
    border-radius: 999px;
    cursor: pointer;
    transition: color 0.2s ease;
  }

  .tabs input:checked + label {
    color: #1a1a1a;
    background: linear-gradient(to bottom right, #FFFFFF, #FFFFFF80);
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
  }
</style>
</head>
<body>
  <div class="tabs">
    <input type="radio" name="tab" id="t1" checked><label for="t1">Day</label>
    <input type="radio" name="tab" id="t2"><label for="t2">Week</label>
    <input type="radio" name="tab" id="t3"><label for="t3">Month</label>
  </div>
</body>
</html>
