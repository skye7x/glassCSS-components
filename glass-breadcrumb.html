<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glass Breadcrumb</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #20232e; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  .crumbs {
    position: relative; display: flex; align-items: center; gap: 8px;
    padding: 10px 18px; border-radius: 999px; background: rgba(255,255,255,0.06);
    backdrop-filter: blur(14px); overflow: hidden;
  }
  .crumbs::before {
    content: ""; position: absolute; inset: 0; padding: 1px; border-radius: 999px;
    background: linear-gradient(-15deg, rgba(255,255,255,0.08) 11%, rgba(255,255,255,0.2) 60%, rgba(255,255,255,0.85) 100%);
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude; pointer-events: none;
  }
  .crumbs a { color: rgba(255,255,255,0.55); text-decoration: none; font-size: 13px; font-weight: 500; }
  .crumbs a.current { color: #fff; font-weight: 700; }
  .crumbs .sep { color: rgba(255,255,255,0.3); font-size: 12px; }
</style>
</head>
<body>
  <div class="crumbs">
    <a href="#">Home</a><span class="sep">/</span>
    <a href="#">Projects</a><span class="sep">/</span>
    <a href="#" class="current">Redesign 2.0</a>
  </div>
</body>
</html>
