<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glass Bottom Nav</title>
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    background: url('https://images.unsplash.com/photo-1519681393784-d120267933ba?w=1200&q=60') center/cover;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  .nav {
    position: relative;
    width: min(380px, 92vw);
    margin-bottom: 24px;
    display: flex;
    justify-content: space-around;
    align-items: center;
    padding: 10px 8px calc(10px + env(safe-area-inset-bottom));
    border-radius: 28px;
    background: rgba(20, 20, 26, 0.45);
    backdrop-filter: blur(24px);
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45);
    overflow: hidden;
  }

  .nav::before {
    content: "";
    position: absolute;
    inset: 0;
    padding: 1px;
    border-radius: 28px;
    background: linear-gradient(
      -15deg,
      rgba(255, 255, 255, 0.12) 11%,
      rgba(255, 255, 255, 0.3) 60%,
      rgba(255, 255, 255, 1) 100%
    );
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events: none;
  }

  .item {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    padding: 8px 14px;
    border-radius: 18px;
    color: rgba(255, 255, 255, 0.55);
    cursor: pointer;
    transition: color 0.2s ease, background 0.2s ease;
  }

  .item svg {
    width: 22px;
    height: 22px;
    stroke: currentColor;
    fill: none;
  }

  .item span {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.01em;
  }

  .item.active {
    color: #1a1a1a;
    background: linear-gradient(to bottom right, #FFFFFF, #FFFFFF80);
  }

  .item.active svg { stroke: #1a1a1a; }
</style>
</head>
<body>
  <nav class="nav">
    <div class="item active">
      <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12l9-9 9 9"></path><path d="M9 21V12h6v9"></path></svg>
      <span>Home</span>
    </div>
    <div class="item">
      <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      <span>Search</span>
    </div>
    <div class="item">
      <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21l7.78-7.55 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
      <span>Saved</span>
    </div>
    <div class="item">
      <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21v-1a7 7 0 0 1 14 0v1"></path></svg>
      <span>Profile</span>
    </div>
  </nav>
</body>
</html>
