<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glass Calendar</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #202436; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  .cal {
    position: relative; width: 260px; padding: 18px; border-radius: 20px;
    background: rgba(255,255,255,0.07); backdrop-filter: blur(18px); overflow: hidden;
  }
  .cal::before {
    content: ""; position: absolute; inset: 0; padding: 1px; border-radius: 20px;
    background: linear-gradient(-15deg, rgba(255,255,255,0.08) 11%, rgba(255,255,255,0.22) 60%, rgba(255,255,255,0.9) 100%);
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude; pointer-events: none;
  }
  .head { display: flex; justify-content: space-between; align-items: center; color: #fff; font-size: 14px; font-weight: 700; margin-bottom: 12px; }
  .head span { cursor: pointer; opacity: 0.6; font-weight: 400; }
  .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .grid .d { text-align: center; font-size: 11px; color: rgba(255,255,255,0.35); padding-bottom: 6px; }
  .grid .n {
    text-align: center; font-size: 12px; color: rgba(255,255,255,0.75);
    padding: 7px 0; border-radius: 999px; cursor: pointer;
  }
  .grid .n.today { background: rgba(255,255,255,0.12); }
  .grid .n.selected {
    background: linear-gradient(to bottom right, #FFFFFF, #FFFFFF80);
    color: #1a1a1a; font-weight: 700;
  }
  .grid .n.muted { color: rgba(255,255,255,0.2); }
</style>
</head>
<body>
  <div class="cal">
    <div class="head"><span>‹</span>August 2026<span>›</span></div>
    <div class="grid">
      <div class="d">S</div><div class="d">M</div><div class="d">T</div><div class="d">W</div><div class="d">T</div><div class="d">F</div><div class="d">S</div>
      <div class="n muted">26</div><div class="n muted">27</div><div class="n muted">28</div><div class="n muted">29</div><div class="n muted">30</div><div class="n muted">31</div><div class="n">1</div>
      <div class="n">2</div><div class="n">3</div><div class="n">4</div><div class="n">5</div><div class="n">6</div><div class="n">7</div><div class="n">8</div>
      <div class="n">9</div><div class="n">10</div><div class="n">11</div><div class="n">12</div><div class="n">13</div><div class="n">14</div><div class="n">15</div>
      <div class="n today">15</div><div class="n">16</div><div class="n">17</div><div class="n selected">18</div><div class="n">19</div><div class="n">20</div><div class="n">21</div>
    </div>
  </div>
</body>
</html>
