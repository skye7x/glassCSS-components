<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glass Chip Input</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #1c1f29; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  .field {
    position: relative; width: 300px; display: flex; flex-wrap: wrap; gap: 6px;
    padding: 10px; border-radius: 16px; background: rgba(255,255,255,0.06);
    backdrop-filter: blur(16px); overflow: hidden;
  }
  .field::before {
    content: ""; position: absolute; inset: 0; padding: 1px; border-radius: 16px;
    background: linear-gradient(-15deg, rgba(255,255,255,0.08) 11%, rgba(255,255,255,0.22) 60%, rgba(255,255,255,0.9) 100%);
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude; pointer-events: none;
  }
  .chip {
    display: flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 999px;
    background: rgba(255,255,255,0.12); color: #fff; font-size: 12px; font-weight: 600;
  }
  .chip .x { opacity: 0.5; cursor: pointer; font-size: 13px; }
  .field input {
    flex: 1; min-width: 80px; border: none; outline: none; background: transparent;
    color: #fff; font-size: 13px; padding: 5px;
  }
  .field input::placeholder { color: rgba(255,255,255,0.35); }
</style>
</head>
<body>
  <div class="field">
    <span class="chip">Design<span class="x">×</span></span>
    <span class="chip">Frontend<span class="x">×</span></span>
    <span class="chip">Q3<span class="x">×</span></span>
    <input type="text" placeholder="Add tag…">
  </div>
</body>
</html>
