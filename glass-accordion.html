<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glass Accordion</title>
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #1b1e2a;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  .accordion {
    width: 320px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .item {
    position: relative;
    border-radius: 16px;
    background: rgba(255, 255, 255, 0.06);
    backdrop-filter: blur(16px);
    overflow: hidden;
  }

  .item::before {
    content: "";
    position: absolute;
    inset: 0;
    padding: 1px;
    border-radius: 16px;
    background: linear-gradient(-15deg, rgba(255,255,255,0.08) 11%, rgba(255,255,255,0.2) 60%, rgba(255,255,255,0.85) 100%);
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events: none;
  }

  .item input { display: none; }

  .item label {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 15px 18px;
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }

  .item label svg {
    width: 16px;
    height: 16px;
    transition: transform 0.25s ease;
  }

  .item input:checked ~ label svg { transform: rotate(180deg); }

  .content {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.25s ease;
    padding: 0 18px;
  }

  .item input:checked ~ .content {
    max-height: 120px;
    padding: 0 18px 16px;
  }

  .content p {
    margin: 0;
    font-size: 13px;
    color: rgba(255, 255, 255, 0.65);
    line-height: 1.5;
  }
</style>
</head>
<body>
  <div class="accordion">
    <div class="item">
      <input type="checkbox" id="q1" checked>
      <label for="q1">What is included in the plan?
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
      </label>
      <div class="content"><p>All core features, unlimited projects, and priority support are included at no extra cost.</p></div>
    </div>
    <div class="item">
      <input type="checkbox" id="q2">
      <label for="q2">Can I cancel anytime?
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
      </label>
      <div class="content"><p>Yes, cancel anytime from your account settings with no penalties.</p></div>
    </div>
  </div>
</body>
</html>
