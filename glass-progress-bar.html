<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glass Progress Bar</title>
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #1e2129;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  .wrap {
    width: 280px;
    color: #fff;
  }

  .top {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    margin-bottom: 8px;
    color: rgba(255, 255, 255, 0.75);
  }

  .track {
    position: relative;
    height: 12px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.07);
    backdrop-filter: blur(10px);
    overflow: hidden;
  }

  .track::before {
    content: "";
    position: absolute;
    inset: 0;
    padding: 1px;
    border-radius: 999px;
    background: linear-gradient(-15deg, rgba(255,255,255,0.08) 11%, rgba(255,255,255,0.2) 60%, rgba(255,255,255,0.85) 100%);
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    z-index: 2;
    pointer-events: none;
  }

  .fill {
    height: 100%;
    width: 64%;
    border-radius: 999px;
    background: linear-gradient(to right, #60a5fa, #a78bfa);
    box-shadow: 0 0 10px rgba(96, 165, 250, 0.6);
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="top"><span>Uploading…</span><span>64%</span></div>
    <div class="track"><div class="fill"></div></div>
  </div>
</body>
</html>
