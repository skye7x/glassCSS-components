<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glass Counter</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #1c1f2a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  .counter {
    position: relative; display: flex; align-items: center; gap: 4px;
    padding: 6px; border-radius: 999px; background: rgba(255,255,255,0.07);
    backdrop-filter: blur(16px); overflow: hidden;
  }
  .counter::before {
    content: ""; position: absolute; inset: 0; padding: 1px; border-radius: 999px;
    background: linear-gradient(-15deg, rgba(255,255,255,0.08) 11%, rgba(255,255,255,0.22) 60%, rgba(255,255,255,0.9) 100%);
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude; pointer-events: none;
  }
  .counter button {
    width: 34px; height: 34px; border-radius: 50%; border: none; cursor: pointer;
    background: rgba(255,255,255,0.08); color: #fff; font-size: 18px; font-weight: 600;
    display: flex; align-items: center; justify-content: center;
  }
  .counter button:hover { background: rgba(255,255,255,0.16); }
  .counter .val { width: 36px; text-align: center; color: #fff; font-size: 15px; font-weight: 600; }
</style>
</head>
<body>
  <div class="counter">
    <button aria-label="Decrease">−</button>
    <span class="val">3</span>
    <button aria-label="Increase">+</button>
  </div>
</body>
</html>
