<!DOCTYPE html>
<html>
<head>
<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #771a1a;
  }

  button {
    font-size: 17px;
    font-weight: 600;
    padding: 12px 28px;
    border-radius: 999px;
    border: 1.5px solid #F5F5F5;
    background: linear-gradient(to bottom right, #FFFFFF, #FFFFFF80);
    color: #1a1a1a;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
</style>
</head>
<body>
  <button>
    <img
       src="https://www.svgrepo.com/show/532143/align-left.svg"
       alt="Align left"
       width="auto"
       height="24"
    >
    example
  </button>
</body>
</html>
