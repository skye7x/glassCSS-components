<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glass Dropzone</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #191c26; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  .drop {
    position: relative; width: 300px; padding: 36px 20px; border-radius: 20px;
    background: rgba(255,255,255,0.05); backdrop-filter: blur(16px);
    text-align: center; overflow: hidden; cursor: pointer;
  }
  .drop::before {
    content: ""; position: absolute; inset: 0; padding: 1.5px; border-radius: 20px;
    background: linear-gradient(-15deg, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0.3) 50%, rgba(255,255,255,0.1) 100%);
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude; pointer-events: none;
  }
  .drop svg { width: 34px; height: 34px; stroke: rgba(255,255,255,0.6); margin-bottom: 10px; }
  .drop h4 { margin: 0 0 4px; color: #fff; font-size: 14px; }
  .drop p { margin: 0; color: rgba(255,255,255,0.45); font-size: 12px; }
</style>
</head>
<body>
  <div class="drop">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M12 4l-4 4M12 4l4 4"></path><path d="M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"></path></svg>
    <h4>Drop files to upload</h4>
    <p>or click to browse — up to 20MB</p>
  </div>
</body>
</html>
