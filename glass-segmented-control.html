<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glass Segmented Control</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #22252f; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  .segmented {
    position: relative; display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px;
    width: 280px; padding: 4px; border-radius: 14px; background: rgba(0,0,0,0.3);
    backdrop-filter: blur(14px); overflow: hidden;
  }
  .segmented::before {
    content: ""; position: absolute; inset: 0; padding: 1px; border-radius: 14px;
    background: linear-gradient(-15deg, rgba(255,255,255,0.08) 11%, rgba(255,255,255,0.22) 60%, rgba(255,255,255,0.9) 100%);
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude; pointer-events: none;
  }
  .segmented input { display: none; }
  .segmented label {
    text-align: center; padding: 8px 0; font-size: 13px; font-weight: 600;
    color: rgba(255,255,255,0.55); border-radius: 10px; cursor: pointer; position: relative; z-index: 1;
  }
  .segmented input:checked + label {
    color: #1a1a1a; background: linear-gradient(to bottom right, #FFFFFF, #FFFFFF80);
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
  }
</style>
</head>
<body>
  <div class="segmented">
    <input type="radio" name="seg" id="s1"><label for="s1">List</label>
    <input type="radio" name="seg" id="s2" checked><label for="s2">Board</label>
    <input type="radio" name="seg" id="s3"><label for="s3">Timeline</label>
  </div>
</body>
</html>
